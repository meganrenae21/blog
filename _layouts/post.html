---
layout: default
---
<div class="post_header">
    <h2 class="post_title">{{ page.title }}</h2>
    <div class="post_meta">
        <div class="post_date">{{ page.date | date: "%A, %B %d, %Y" }}</div>
        <div class="tag_list">
            {% for tag in page.tags %}
            <a class="tag_link_post" href="{{ site.url }}/tags/{{tag}}.html">{{ tag }}</a> 
            {% endfor %}
        </div>
    </div>
</div>
<div class="post_content">
    {% if page.note %}
    <blockquote class="post_note">
        {% assign note = site.data.postnotes | where: "name", page.note %}
        {{ note[0].text }}
    </blockquote>
    {% endif %}
    {{ content }}
</div>
<a href='https://ko-fi.com/C0C8DB54U' target='_blank'><img height='36' style='border:0px;height:36px;' src='https://storage.ko-fi.com/cdn/kofi4.png?v=6' border='0' alt='Buy Me a Coffee at ko-fi.com' /></a>
<div class="comments_container">
    <iframe class="comments_frame" src="{{ page.comments_url }}/noheader"></iframe>
</div>
